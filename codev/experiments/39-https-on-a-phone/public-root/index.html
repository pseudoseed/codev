<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Codev Spike">
  <title>Experiment 39 — root-scoped PWA</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <style>
    :root { color-scheme: light; }
    body { font: 18px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); color: #1a1714; background: #f4efe6; }
    h1 { font-size: 22px; margin: 0 0 12px; }
    p { margin: 0 0 12px; }
    button { min-height: 44px; min-width: 44px; font-size: 16px; padding: 10px 16px; margin: 0 8px 8px 0; border: 1px solid #1a1714; background: #fff; }
    code, pre { font: 14px/1.4 ui-monospace, Menlo, monospace; }
    pre { white-space: pre-wrap; background: #fff; padding: 12px; border: 1px solid #d7d0c4; }
  </style>
</head>
<body>
  <h1>Experiment 39 (root)</h1>
  <p>Dedicated-host variant. Scope is <code>/</code>. Not the <code>/v2/spike/</code> copy.</p>
  <p id="ctx"></p>
  <p>
    <button id="perm">Ask notification permission</button>
    <button id="sub">Subscribe push</button>
  </p>
  <pre id="log"></pre>
  <script src="/app.js"></script>
</body>
</html>
