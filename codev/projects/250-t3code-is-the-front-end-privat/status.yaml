        RUNNING CHECKS...
          plan_exists OK
          has_phases_json OK
          min_two_phases OK (11 phases)

        Reviews: claude REQUEST_CHANGES, codex REQUEST_CHANGES, opencode REQUEST_CHANGES
        All findings accepted; nothing in the disagree column.

        Three deviations from the spec as written:
        1. Migration mechanism - you already ruled on this; spec risk row amended.
        2. Spec Security section asserts connect-src 'self' stays closed. t3code sets
           CSP on .svg responses only (http.ts:51,62); there is no page-level CSP.
           You said you are fixing the Security section.
        3. Spec test scenarios imply browser verification in t3code. t3code has no
           Playwright; apps/web is vitest-only. Harness moved into this repo.

        Most damaging finding caught: acquire() checks pin.commit out into the
        read-only upstream clone (t3-server.mjs:94), called from smoke.mjs:156 and
        live/integration.mjs:196, so it would have fired from an ordinary test run
        once pin.commit named the fork.
