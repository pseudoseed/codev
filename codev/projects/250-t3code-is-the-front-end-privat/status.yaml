          consequence: >-
            Same plan, but phase 1 waits until you have run gh repo fork and told me the fork exists. Removes the only
            outward-facing act from my hands; costs a round trip.
        - label: Send back for changes
          consequence: >-
            Name what to change. The plan has had three review lanes and two rounds of my own verification, so a fourth
