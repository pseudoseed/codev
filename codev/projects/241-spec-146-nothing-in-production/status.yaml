        T3codeSessionCache already opens a production subscribeThread stream per thread, for display. Fold the new
        control-plane subscription onto it now, or keep them separate this PR?
      choices:
        - label: Keep separate, follow-up issue
          consequence: >-
            New ResumingSubscription pool feeds the engine; the cache keeps its own stream. Two read-only streams per
            watched thread. Smallest blast radius, no change to the cache's watching/stale semantics or its tests,
            easiest rebase against builder-air-227.
          recommended: true
        - label: Fold onto one stream now
          consequence: >-
            One stream per thread, two consumers. Requires rewriting the cache's watching/stale vocabulary, which is
            keyed on a stream that ends -- a ResumingSubscription never ends -- plus its tests. Larger PR on the
            critical path to phase 14.
