    request:
      question: >-
        Fixing #272 requires a t3code fork commit (an empty project draws no sidebar heading today), and any fork commit
        obliges the full REFRESH.md tail. Take that scope, or narrow it?
      choices:
        - label: 'Full scope: both repos plus the REFRESH tail'
          consequence: >-
            Codev gets the workspace name and a Tower reconciler; the fork gets a heading for a project with zero
            architects. Then pin.commit moves, the contract is regenerated, patches are re-exported and the four
            spec-250 evidence collectors are re-run against a live fork server. Delivers the issue as written.
          recommended: true
        - label: 'Codev repo only: name the workspaces, defer the empty-heading'
          consequence: >-
            Project titles become codev-1455 rather than codev:/Users/chris/dev/codev-1455, and a project row exists for
            every known workspace. But a workspace with no architect still draws nothing on screen, so half of the issue
            stays open and needs a second PR carrying the REFRESH tail anyway.
        - label: 'Fork only: heading first, names later'
          consequence: >-
            Empty workspaces appear, still labelled with prefixed absolute paths. Pays the REFRESH tail now and leaves
            the complaint that a sidebar of full paths does not scan.
